[env:esp32c3-master]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 460800
upload_protocol = esptool
upload_port = /dev/cu.usbmodem*

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    Adafruit NeoPixel
    ArduinoJson@^6.21.0
    https://github.com/4-20ma/ModbusMaster.git
