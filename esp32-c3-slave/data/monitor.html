<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serial Monitor - Batch Flow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            background: #0d1117;
            color: #c9d1d9;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 16px;
            gap: 12px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #161b22;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .header h1 {
            font-size: 20px;
            margin: 0;
        }
        .controls {
            display: flex;
            gap: 8px;
        }
        button {
            padding: 8px 16px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: background 0.2s;
        }
        button:hover {
            background: #2ea043;
        }
        button:active {
            transform: scale(0.95);
        }
        button.danger {
            background: #da3633;
        }
        button.danger:hover {
            background: #f85149;
        }
        .monitors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }
        @media (max-width: 1200px) {
            .monitors {
                grid-template-columns: 1fr;
            }
        }
        .monitor {
            display: flex;
            flex-direction: column;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }
        .monitor-title {
            padding: 12px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-online {
            background: #238636;
            color: white;
        }
        .status-offline {
            background: #da3633;
            color: white;
        }
        .monitor-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-line {
            margin-bottom: 2px;
        }
        .log-timestamp {
            color: #7d8590;
            margin-right: 8px;
        }
        .log-tag {
            color: #79c0ff;
            font-weight: 600;
        }
        .log-online {
            color: #3fb950;
        }
        .log-error {
            color: #f85149;
        }
        .log-warning {
            color: #ff9500;
        }
        .log-modbus {
            color: #d29922;
        }
        .scroll-bottom {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            background: #0d1117;
            border-top: 1px solid #30363d;
        }
        .scroll-bottom button {
            padding: 4px 12px;
            font-size: 11px;
        }
        .timestamp {
            color: #7d8590;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🔍 Serial Monitor</h1>
                <div class="timestamp" id="lastUpdate">Last updated: --:--:--</div>
            </div>
            <div class="controls">
                <button onclick="clearBothLogs()">Clear All</button>
                <button onclick="toggleAutoScroll()">Auto-Scroll: ON</button>
                <button class="danger" onclick="refreshNow()">Refresh</button>
            </div>
        </div>

        <div class="monitors">
            <div class="monitor">
                <div class="monitor-title">
                    Master (192.168.4.1)
                    <span class="status-badge status-online" id="masterStatus">LOADING</span>
                </div>
                <div class="monitor-content" id="masterContent">
                    <div class="log-line"><span class="timestamp">[--:--:--]</span> Connecting to master...</div>
                </div>
                <div class="scroll-bottom">
                    <button onclick="scrollToBottom('masterContent')">↓ Scroll to Bottom</button>
                </div>
            </div>

            <div class="monitor">
                <div class="monitor-title">
                    Slave (192.168.5.1)
                    <span class="status-badge status-online" id="slaveStatus">LOADING</span>
                </div>
                <div class="monitor-content" id="slaveContent">
                    <div class="log-line"><span class="timestamp">[--:--:--]</span> Connecting to slave...</div>
                </div>
                <div class="scroll-bottom">
                    <button onclick="scrollToBottom('slaveContent')">↓ Scroll to Bottom</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            MASTER_URL: 'http://192.168.4.1/api/serial',
            SLAVE_URL: 'http://192.168.5.1/api/serial',
            POLL_INTERVAL: 500, // ms
            TIMEOUT: 3000 // ms
        };

        let autoScroll = true;
        let lastMasterContent = '';
        let lastSlaveContent = '';
        let pollTimer = null;

        function scrollToBottom(containerId) {
            const elem = document.getElementById(containerId);
            elem.scrollTop = elem.scrollHeight;
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            event.target.textContent = `Auto-Scroll: ${autoScroll ? 'ON' : 'OFF'}`;
        }

        function updateTimestamp() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { 
                hour12: false,
                hour: '2-digit',
                minute: '2-digit', 
                second: '2-digit'
            });
            document.getElementById('lastUpdate').textContent = `Last updated: ${timeStr}`;
        }

        function formatLogContent(content) {
            if (!content) return 'No data yet...';
            
            // Split into lines and create log elements
            return content
                .split('\n')
                .filter(line => line.trim().length > 0)
                .map(line => {
                    let className = 'log-line';
                    
                    // Color code by content
                    if (line.includes('ONLINE')) className += ' log-online';
                    if (line.includes('OFFLINE') || line.includes('TIMEOUT') || line.includes('ERROR')) className += ' log-error';
                    if (line.includes('WARNING') || line.includes('FAIL')) className += ' log-warning';
                    if (line.includes('Modbus') || line.includes('TX') || line.includes('RX')) className += ' log-modbus';
                    
                    return `<div class="${className}">${escapeHtml(line)}</div>`;
                })
                .join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function fetchSerialLog(url, device) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), CONFIG.TIMEOUT);
                
                const response = await fetch(url, {
                    signal: controller.signal,
                    cache: 'no-cache'
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const text = await response.text();
                return { success: true, text, device };
            } catch (error) {
                console.warn(`${device} error:`, error.message);
                return { success: false, error: error.message, device };
            }
        }

        async function pollBothDevices() {
            const results = await Promise.all([
                fetchSerialLog(CONFIG.MASTER_URL, 'Master'),
                fetchSerialLog(CONFIG.SLAVE_URL, 'Slave')
            ]);

            for (const result of results) {
                if (result.device === 'Master') {
                    updateMonitor('master', result);
                } else if (result.device === 'Slave') {
                    updateMonitor('slave', result);
                }
            }

            updateTimestamp();
        }

        function updateMonitor(device, result) {
            const contentId = device + 'Content';
            const statusId = device + 'Status';
            const contentElem = document.getElementById(contentId);

            if (!result.success) {
                document.getElementById(statusId).className = 'status-badge status-offline';
                document.getElementById(statusId).textContent = 'OFFLINE';
                contentElem.innerHTML = `<div class="log-line log-error">[!] Connection failed: ${escapeHtml(result.error)}</div>`;
                return;
            }

            document.getElementById(statusId).className = 'status-badge status-online';
            document.getElementById(statusId).textContent = 'ONLINE';

            if (result.text !== (device === 'master' ? lastMasterContent : lastSlaveContent)) {
                contentElem.innerHTML = formatLogContent(result.text);
                if (device === 'master') {
                    lastMasterContent = result.text;
                } else {
                    lastSlaveContent = result.text;
                }

                if (autoScroll) {
                    setTimeout(() => scrollToBottom(contentId), 50);
                }
            }
        }

        function refreshNow() {
            console.log('Manual refresh');
            pollBothDevices();
        }

        function clearBothLogs() {
            if (confirm('Clear all logs? This will only clear the display.')) {
                document.getElementById('masterContent').innerHTML = '<div class="log-line">[Cleared]</div>';
                document.getElementById('slaveContent').innerHTML = '<div class="log-line">[Cleared]</div>';
                lastMasterContent = '';
                lastSlaveContent = '';
            }
        }

        // Start polling
        function startPolling() {
            pollBothDevices();
            pollTimer = setInterval(pollBothDevices, CONFIG.POLL_INTERVAL);
        }

        function stopPolling() {
            if (pollTimer) clearInterval(pollTimer);
        }

        // Lifecycle
        window.addEventListener('load', startPolling);
        window.addEventListener('beforeunload', stopPolling);
    </script>
</body>
</html>
