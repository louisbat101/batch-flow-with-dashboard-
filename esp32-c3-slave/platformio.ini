; ESP32-C3 Super Mini + ESC3E05 Relay Board
; Relay control on GPIO 5/6/7/10, RS-485 on GPIO 9/20/21
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool
upload_port = /dev/cu.usbmodem*
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^6.21.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -I../shared
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
